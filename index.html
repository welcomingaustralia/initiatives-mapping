<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcoming Map - Working Copy</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    .leaflet-control,
    .leaflet-popup-content {
      font-family: Arial, Helvetica, sans-serif;
    }

    #map {
      height: 100%;
      width: calc(100% - 340px);
      margin-left: 340px;
    }

    .searchDropdown {
      position: absolute;
      background: white;
      border: 1px solid #ccc;
      width: 100%;
      max-height: 260px;
      overflow-y: auto;
      display: none;
      z-index: 20000;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      box-sizing: border-box;
      left: 0;
      top: 42px;
    }

    .searchDropdown div {
      padding: 8px 10px;
      font-size: 14px;
      cursor: pointer;
    }

    .searchDropdown div:hover {
      background: #f2f2f2;
    }

    .searchWrapper {
      position: relative;
  }

    .searchWrapper input {
      padding-right: 34px;
    }
    
    .clearSearch {
      position: absolute;
      right: 12px;
      top: 0;
      bottom: 0;
      width: 20px;
      display: none;        
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 18px;
      cursor: pointer;
      user-select: none;
  }

    .searchWrapper.hasText .clearSearch {
        display: flex;
    }
  
  .clearSearch:hover {
      color: #444;
  }

    .legend {
      background-color: white;
      padding: 15px;
      border: 2px solid #bbb;
      border-radius: 8px;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
      font-size: 14px;
      line-height: 1.4;
    }

    .legend i {
      min-width: 18px;
      text-align: center;
    }

    .leaflet-control-layers {
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      background: white;
      font-size: 14px;
    }
    
#mobileMenuButton,
#mobileMenuPanel {
  display: none;
}
    #desktopExplorerPanel {
      position: absolute;
      top: 0;
      left: 0;
      width: 340px;
      height: 100vh;
      z-index: 30000;
      background: white;
      box-shadow: 2px 0 8px rgba(0,0,0,0.25);
      padding: 18px;
      box-sizing: border-box;
      overflow-y: auto;
    }
    
    #desktopExplorerPanel h2 {
      margin: 0 0 18px 0;
      font-size: 20px;
    }

    .explorerBrand {
         display: flex;
         align-items: center;
         gap: 12px;
         margin-bottom: 18px;
     }
      
     .explorerBrand img {
        width: 185px;
         height: auto;
     }
      
    .brandDivider {
        width: 1px;
        height: 32px;
        background: #d8d8d8;
     }
      
    .brandText {
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-size: 24px;
      font-weight: 300;
      color: #444;
      letter-spacing: 0.3px;
  }
    
    .panelSection {
      border-top: 1px solid #ddd;
      padding-top: 14px;
      margin-top: 14px;
     }
    
    .panelSection h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
    }
    
    
    .panelSection input,
    .panelSection select {
      width: 100%;
      box-sizing: border-box;
      font-size: 15px;
      padding: 9px 10px;
      border: 1px solid #bbb;
      border-radius: 6px;
      background: white;
      color: black;
    }
    
    #stateFilter,
    #lgaSearch {
      margin-bottom: 10px;
    }


    .layerCard .summaryRow span:first-child {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 18px;
      margin: 0;
      flex-shrink: 0;
    }
    
    .switch input {
      opacity: 0;
      width: 0 !important;
      height: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    
    .switch span {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #bdbdbd;
      border-radius: 999px;
      transition: 0.2s;
    }
    
    .switch span:before {
      content: "";
      position: absolute;
      height: 14px;
      width: 14px;
      left: 2px;
      top: 2px;
      background: white;
      border-radius: 50%;
      transition: 0.2s;
      box-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }
    
    .switch input:checked + span {
      background: #2EAD4B;
    }
    
    .switch input:checked + span:before {
      transform: translateX(16px);
    }

    .layerCard .layerRow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 24px;
      padding: 0;
      margin: 0;
      font-size: 13px;
    }


  
    
    .legendDot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
    
    .legendSwatch {
      width: 13px;
      height: 13px;
      display: inline-block;
    }
    .overviewCard {
      background: #f7f7f7;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px 12px;
    }
    
    .overviewCard h4 {
      margin: 0 0 8px 0;
      font-size: 15px;
    }
    
    .summaryRow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      line-height: 1.5;
      padding: 3px 0;
      border-top: 1px solid #ececec;
  }
    
    .summaryRow:first-of-type {
      border-top: none;
    }
    
    .summaryRow span {
      color: #333;
    }
    
    .summaryRow strong {
      font-weight: 700;
    }

    .totalRow {
      font-size: 14px;
      font-weight: 700;
    }
    
    .subRow span {
      padding-left: 14px;
    }
    
    .subSubRow span {
      padding-left: 28px;
      color: #666;
    }
    
    .legendSwatch {
      width: 13px;
      height: 13px;
      display: inline-block;
      flex-shrink: 0;
    }
    
    .welcomingCitySwatch {
      background: #CCA234;
      border: 1px solid #CCA234;
    }
    
    .palmSwatch {
      border: 2px dashed #EC6C5B;
    }
    
    .uniDot { background:#00AFC7; }
    .workplaceDot { background:#FD4731; }
    .clubDot { background:#228B22; }
    .copDot { background:#ff8800; }
    .hubDot { background:#02006C; }
    .crispDot { background:#d98ca3; }

    
    @media (max-width: 600px) {
      .leaflet-control-layers {
        display: none;
      }
      #desktopExplorerPanel {
        display: none;
      }
    
      #map {
        width: 100%;
        margin-left: 0;
      }
    
      #mobileMenuButton {
        display: block;
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 50000;
        background: white;
        color: #000 !important;
        border: 1px solid #aaa;
        border-radius: 7px;
        padding: 10px 13px;
        font-size: 16px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      }
    
      #mobileMenuPanel {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 60000;
        background: white;
        width: 74vw;
        max-width: 320px;
        height: 100vh;
        overflow-y: auto;
        padding: 14px;
        box-shadow: 3px 0 12px rgba(0,0,0,0.35);
        box-sizing: border-box;
      }
    
      #mobileMenuPanel.open {
        display: block;
      }
    
      #mobileMenuClose {
        float: right;
        font-size: 32px;
        background: none;
        border: none;
        cursor: pointer;
      }
    
      #mobileMenuPanel h3 {
        font-size: 18px;
        margin: 4px 0 20px 0;
        color: black !important;
      }
    
      .mobileMenuSection {
        margin-bottom: 16px;
      }
    
      .mobileMenuSection label {
        display: block;
        font-size: 15px;
        margin: 7px 0;
      }
    
      .mobileMenuSection input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        font-size: 16px;
        padding: 10px 12px;
        border: 1px solid #bbb;
        border-radius: 6px;
      }

      .mobileMenuSection select {
        width: 100%;
        box-sizing: border-box;
        font-size: 16px;
        padding: 10px 12px;
        border: 1px solid #bbb;
        border-radius: 6px;
        background: white;
        color: black;
      }
    
      .mobileLayerToggle {
        transform: scale(1.3);
        margin-right: 10px;
      }
    
      .mobileDropdown {
        display: none;
        border: 1px solid #ccc;
        max-height: 260px;
        overflow-y: auto;
        margin-top: 6px;
        background: white;
      }
    
      .mobileDropdown div {
        padding: 10px 12px;
        font-size: 15px;
        cursor: pointer;
        border-bottom: 1px solid #eee;
      }
    
      .legend {
        font-size: 11px;
        padding: 6px 8px;
        max-width: 155px;
        line-height: 1.25;
    }

      .legend i,
      .legend span {
          width: 9px !important;
          height: 9px !important;
          min-width: 9px !important;
          margin-right: 4px !important;
      }
      
      .leaflet-popup-content {
        font-size: 14px;
        line-height: 1.35;
        min-width: 210px;
        max-width: 260px;
      }
      
      .leaflet-popup-content h3 {
        font-size: 17px;
        margin-bottom: 6px;
      }
      
      .leaflet-popup-content p {
        margin: 3px 0 !important;
      }
      
      .leaflet-popup-content ul {
        margin-top: 3px !important;
      }
    }
  </style>
</head>

<body>

<div id="desktopExplorerPanel">
  <div class="explorerBrand">
    <img src="https://raw.githubusercontent.com/welcomingaustralia/initiatives-mapping/main/wa-logo.png" alt="Welcoming Australia logo">
    <span class="brandDivider"></span>
    <span class="brandText">Explorer</span>
  </div>

  <div class="panelSection">
    <h3>Search</h3>

    <select id="stateFilter">
      <option value="ALL">All States & Territories</option>
      <option value="ACT">ACT</option>
      <option value="NSW">NSW</option>
      <option value="NT">NT</option>
      <option value="QLD">QLD</option>
      <option value="SA">SA</option>
      <option value="TAS">TAS</option>
      <option value="VIC">VIC</option>
      <option value="WA">WA</option>
    </select>
   

    <div class="searchWrapper">
        <input id="lgaSearch" type="text" placeholder="Search council...">
        <span class="clearSearch" data-target="lgaSearch">×</span>
    </div>
    
    <div class="searchWrapper">
        <input id="orgSearch" type="text" placeholder="Search organisation...">
        <span class="clearSearch" data-target="orgSearch">×</span>
    </div>
  </div>

  <div class="panelSection">
  <h3>Map Layers & Legend</h3>

  <div class="overviewCard layerCard">
    <div class="layerRow">
      <span><span class="legendSwatch welcomingCitySwatch"></span> Welcoming Cities</span>
      <strong></strong>
    </div>

    <div class="layerRow">
      <span><span class="legendSwatch palmSwatch"></span> PALM Mayoral Alliance</span>
      <strong></strong>
    </div>

    <div class="layerRow">
      <span><span class="legendDot uniDot"></span> Welcoming Universities</span>
      <label class="switch">
        <input type="checkbox" class="desktopLayerToggle" data-layer="uni" checked>
        <span></span>
      </label>
    </div>

    <div class="layerRow">
      <span><span class="legendDot workplaceDot"></span> Welcoming Workplaces</span>
      <label class="switch">
        <input type="checkbox" class="desktopLayerToggle" data-layer="workplace" checked>
        <span></span>
      </label>
    </div>

    <div class="layerRow">
      <span><span class="legendDot clubDot"></span> Welcoming Clubs</span>
      <label class="switch">
        <input type="checkbox" class="desktopLayerToggle" data-layer="club" checked>
        <span></span>
      </label>
    </div>

    <div class="layerRow">
      <span><span class="legendDot copDot"></span> Community Organisations</span>
      <label class="switch">
        <input type="checkbox" class="desktopLayerToggle" data-layer="cop" checked>
        <span></span>
      </label>
    </div>

    <div class="layerRow">
      <span><span class="legendDot hubDot"></span> Community Hubs</span>
      <label class="switch">
        <input type="checkbox" class="desktopLayerToggle" data-layer="hub" checked>
        <span></span>
      </label>
    </div>

    <div class="layerRow">
      <span><span class="legendDot crispDot"></span> CRISP Settlements</span>
      <label class="switch">
        <input type="checkbox" class="desktopLayerToggle" data-layer="crisp" checked>
        <span></span>
      </label>
    </div>
  </div>
</div>
  
  <div class="panelSection" id="desktopSummary">
    <h3>Overview</h3>
    <div id="desktopSummaryContent"></div>
  </div>
</div>

<button id="mobileMenuButton">☰ Search & filters</button>

<div id="mobileMenuPanel">
  <button id="mobileMenuClose">×</button>
  <h3>Search & filters</h3>

  <div class="mobileMenuSection">
    <label for="mobileStateFilter">State & Territory</label>
    <select id="mobileStateFilter">
      <option value="ALL">All</option>
      <option value="ACT">ACT</option>
      <option value="NSW">NSW</option>
      <option value="NT">NT</option>
      <option value="QLD">QLD</option>
      <option value="SA">SA</option>
      <option value="TAS">TAS</option>
      <option value="VIC">VIC</option>
      <option value="WA">WA</option>
    </select>
  </div>

  <div class="mobileMenuSection">
    <label for="mobileLgaSearch">Council area</label>
    <input id="mobileLgaSearch" type="text" placeholder="Search council area...">
    <div id="mobileLgaDropdown" class="mobileDropdown"></div>
  </div>

  <div class="mobileMenuSection">
    <label for="mobileOrgSearch">Organisation</label>
    <input id="mobileOrgSearch" type="text" placeholder="Search organisation...">
    <div id="mobileOrgDropdown" class="mobileDropdown"></div>
  </div>

  <div class="mobileMenuSection">
    <h4>Show initiatives</h4>
    <label><input type="checkbox" class="mobileLayerToggle" data-layer="uni" checked> Welcoming Universities</label>
    <label><input type="checkbox" class="mobileLayerToggle" data-layer="workplace" checked> Welcoming Workplaces</label>
    <label><input type="checkbox" class="mobileLayerToggle" data-layer="club" checked> Welcoming Clubs</label>
    <label><input type="checkbox" class="mobileLayerToggle" data-layer="cop" checked> Community Organisations</label>
    <label><input type="checkbox" class="mobileLayerToggle" data-layer="hub" checked> Community Hubs</label>
    <label><input type="checkbox" class="mobileLayerToggle" data-layer="crisp" checked> CRISP Settlements</label>
  </div>
</div>

<div id="map"></div>

<script>
const GEOJSON_URL =
  "https://raw.githubusercontent.com/welcomingaustralia/initiatives-mapping/main/LGA_2025_AUST_GDA2020.min.json";

const POINTS_URL =
  "https://raw.githubusercontent.com/welcomingaustralia/welcoming-map/main/welcoming_points_centroids.csv";

const LGA_MASTER_URL =
  "https://raw.githubusercontent.com/welcomingaustralia/initiatives-mapping/main/lga_master.csv";

const initialZoom = window.innerWidth <= 600 ? 3 : 5;
const map = L.map("map").setView([-25.0, 134.0], initialZoom);
map.zoomControl.setPosition("bottomleft");

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18
}).addTo(map);

const clusterOptions = {
  spiderfyOnMaxZoom: true,
  zoomToBoundsOnClick: true,
  maxClusterRadius: 50,
  disableClusteringAtZoom: 11
};

const uniCluster       = L.markerClusterGroup(clusterOptions);
const workplaceCluster = L.markerClusterGroup(clusterOptions);
const clubCluster      = L.markerClusterGroup(clusterOptions);
const copCluster       = L.markerClusterGroup(clusterOptions);
const hubCluster       = L.markerClusterGroup(clusterOptions);
const crispLayer       = L.layerGroup();

document.head.insertAdjacentHTML("beforeend", `
<style>
.marker-cluster-small,
.marker-cluster-medium,
.marker-cluster-large {
  background: #b0b0b0;
  color: #000000;
}
.marker-cluster-small div,
.marker-cluster-medium div,
.marker-cluster-large div {
  background: rgba(255,255,255,0.6);
}
</style>`);

function loadCSV(url) {
  return fetch(url)
    .then(r => r.text())
    .then(t => Papa.parse(t, { header: true, skipEmptyLines: true }).data);
}

function normaliseName(str) {
  return (str || "").trim().toLowerCase();
}

function publicLGAName(name) {
  if (name === "Unincorporated ACT") return "ACT";
  if (name === "Unincorporated NT") return "NT";
  return name;
}

function publicCountText(count) {
  return count < 5 ? "Less than 5" : count;
}

function crispRadius(count) {
  if (count < 5) return 8;
  return Math.max(10, Math.sqrt(count) * 5);
}

const stateCodeMap = {
  "1": "NSW",
  "2": "VIC",
  "3": "QLD",
  "4": "SA",
  "5": "WA",
  "6": "TAS",
  "7": "NT",
  "8": "ACT",
  "9": "OT"
};

const lgaLayers = {};
const lgaCentres = {};
const stateBounds = {};
let selectedLGALayer = null;
let currentStateFilter = "ALL";
const lgaMasterLookup = {};
const initiativeCountsByLGA = {};
const accreditedOrgsByLGA = {};

let explorerState = {
  selection: {
    state: "ALL",
    lga: null,
    organisation: null
  },
  welcomingCities: {
    members: 0,
    accredited: 0
  },
  palmAlliance: {
    members: 0
  },
  initiatives: {
    universities: 0,
    workplaces: 0,
    clubs: 0,
    communityOrganisations: 0,
    communityHubs: 0,
    total: 0
  },
  accreditation: {
    established: 0,
    advanced: 0,
    excelling: 0,
    total: 0
  },
  crisp: {
    lgas: 0,
    peopleSettled: 0
  },
  organisations: []
};


Promise.all([
  fetch(GEOJSON_URL).then(r => r.json()),
  loadCSV(POINTS_URL),
  loadCSV(LGA_MASTER_URL)
])
.then(([geojson, points, lgaMasterData]) => {

  lgaMasterData.forEach(row => {
    const code = (row.lga_code || "").trim();
  
    if (!code) return;
  
    lgaMasterLookup[code] = row;
  });

  function lgaStyle(feature) {
    const code = feature.properties.LGA_CODE25;
    const profile = lgaMasterLookup[code];
  
    const isWelcoming = profile?.welcoming_city_member?.trim().toUpperCase() === "Y";
    const isPalm = profile?.palm_alliance?.trim().toUpperCase() === "Y";
  
    let style = isWelcoming
      ? { fillColor: "#CCA234", color: "#CCA234", weight: 1, fillOpacity: 0.50 }
      : { fillColor: "#f2f2f2", color: "#999", weight: 0.3, fillOpacity: 0.1 };
  
    if (isPalm) {
      style.color = "#EC6C5B";
      style.weight = 3;
      style.dashArray = "4 4";
    }
  
    return style;
  }

  function highlightLGA(layer) {
    if (selectedLGALayer) {
      selectedLGALayer.setStyle(lgaStyle(selectedLGALayer.feature));
    }

    selectedLGALayer = layer;

    layer.setStyle({
      color: "#666666",
      weight: 3,
      fillOpacity: 0.65
    });

    layer.bringToBack();
  }

  function flashLGA(layer) {
    if (selectedLGALayer && selectedLGALayer !== layer) {
      selectedLGALayer.setStyle(lgaStyle(selectedLGALayer.feature));
    }
  
    selectedLGALayer = layer;
  
    layer.setStyle({
      color: "#ffffff",
      weight: 5,
      fillColor: "#ffffff",
      fillOpacity: 0.65
    });
  
    setTimeout(() => {
      layer.setStyle({
        color: "#666666",
        weight: 3,
        fillOpacity: 0.65
      });
  
      layer.bringToBack();
    }, 900);
}

  function showLGAPopup(rawName, layer) {
    const code = layer.feature.properties.LGA_CODE25;
    const key = normaliseName(rawName);
    const profile = lgaMasterLookup[code];
  
    if (!profile) return;
  
    const isWelcoming = profile.welcoming_city_member?.trim().toUpperCase() === "Y";
    const isPalm = profile.palm_alliance?.trim().toUpperCase() === "Y";

    const counts = initiativeCountsByLGA[key] || {
      uni: new Set(),
      workplace: new Set(),
      club: new Set(),
      cop: new Set(),
      hub: new Set()
    };

    const initiativeRows = [
      ["Welcoming Universities", counts.uni.size],
      ["Welcoming Workplaces", counts.workplace.size],
      ["Welcoming Clubs", counts.club.size],
      ["Community Organisations", counts.cop.size],
      ["Community Hubs", counts.hub.size]
    ].filter(row => row[1] > 0);

    const initiativeText = initiativeRows.length
      ? `
        <hr>
        <p style="margin:8px 0 4px 0;"><strong>Initiatives</strong></p>
        ${initiativeRows.map(row => `
          <p style="margin:4px 0;">${row[0]}: ${row[1]}</p>
        `).join("")}
      `
      : "";

    const accreditedOrgs = accreditedOrgsByLGA[key]
      ? Array.from(accreditedOrgsByLGA[key].values())
      : [];

    const membershipItems = [];

    if (isWelcoming) {
      membershipItems.push(
        `<p style="margin:6px 0;"><strong>Welcoming Cities Network Member</strong></p>`
      );
    }

    if (isPalm) {
      membershipItems.push(
        `<p style="margin:6px 0;"><strong>PALM Mayoral Alliance Member</strong></p>`
      );
    }

    const membershipText = membershipItems.join("");

    const accreditationText = profile.welcoming_city_accreditation?.trim()
      ? `<p style="margin:6px 0;"><strong>Welcoming City Accreditation:</strong> ${profile.welcoming_city_accreditation}</p>`
      : "";

    const accreditedOrgText = accreditedOrgs.length
      ? `
        <hr>
        <p style="margin:8px 0 4px 0;"><strong>Accredited Organisations</strong></p>
        <ul style="margin:4px 0 0 18px; padding:0;">
          ${accreditedOrgs.map(org => `
            <li>${org.name} (${org.level})</li>
          `).join("")}
        </ul>
      `
      : "";

    const popupContent = `
      <div style="min-width:240px;">
        <h3 style="margin:0 0 8px 0;">${rawName}</h3>

        ${membershipText}
        ${accreditationText}

        ${initiativeText}

        ${accreditedOrgText}

        <hr>

        <p style="margin:8px 0 4px 0;"><strong>Community Profile</strong></p>
        <p style="margin:4px 0;"><strong>Born overseas:</strong> ${profile.overseas_born_pct}%</p>
        <p style="margin:4px 0;"><strong>Language other than English:</strong> ${profile.language_other_than_english_pct}%</p>
      </div>
    `;

    layer.bindPopup(popupContent).openPopup();
  }

  L.geoJSON(geojson, {
    style: lgaStyle,
    onEachFeature: (feature, layer) => {
      const rawName = feature.properties.LGA_NAME25 || "";
      const key = normaliseName(rawName);
      const displayName = publicLGAName(rawName);
      const state = stateCodeMap[feature.properties.STE_CODE21];

      if (state) {
        if (!stateBounds[state]) {
          stateBounds[state] = layer.getBounds();
        } else {
          stateBounds[state].extend(layer.getBounds());
        }
      }

      lgaLayers[key] = { layer, displayName, state };

      const centre = layer.getBounds().getCenter();
      lgaCentres[feature.properties.LGA_CODE25] = {
        lat: centre.lat,
        lon: centre.lng,
        displayName
      };

      layer.bindTooltip(displayName);

      layer.on("click", () => {
        highlightLGA(layer);
        showLGAPopup(rawName, layer);
      });
    }
  }).addTo(map);


  const circleColorMap = {
    uni: "#00AFC7",
    workplace: "#FD4731",
    club: "#228B22",
    cop: "#ff8800",
    hub: "#02006C"
  };

  const initiativeMarkers = [];

  points.forEach(r => {
    if (!r.lat || !r.lon) return;

    const type = r.type?.trim().toLowerCase();
    if (type === "crisp") return;

    const lgaKey = normaliseName(r.lga_name);
    const institutionId = r.institution_id?.trim();
    const accreditationLevel = r.accreditation_level?.trim();

    if (lgaKey && institutionId) {
      if (!initiativeCountsByLGA[lgaKey]) {
        initiativeCountsByLGA[lgaKey] = {
          uni: new Set(),
          workplace: new Set(),
          club: new Set(),
          cop: new Set(),
          hub: new Set()
        };
      }

      if (initiativeCountsByLGA[lgaKey][type]) {
      initiativeCountsByLGA[lgaKey][type].add(institutionId);
      }

      if (accreditationLevel) {
        if (!accreditedOrgsByLGA[lgaKey]) {
          accreditedOrgsByLGA[lgaKey] = new Map();
        }

        accreditedOrgsByLGA[lgaKey].set(institutionId, {
          name: r.name,
          level: accreditationLevel
        });
      }
    }

    const markerColor = circleColorMap[type] || "#444";

    const jitterLat = (Math.random() - 0.5) * 0.0015;
    const jitterLon = (Math.random() - 0.5) * 0.0015;

    const marker = L.circleMarker([+r.lat + jitterLat, +r.lon + jitterLon], {
      radius: 7,
      color: markerColor,
      fillColor: markerColor,
      fillOpacity: 0.75,
      weight: 2,
      title: r.name,
      postcode: r.postcode,
      state: (r.state || "").trim().toUpperCase(),
      type: type,
      institutionId: institutionId
    });

    marker.bindTooltip(r.name, {
      direction: "top",
      offset: [0, -10],
      opacity: 0.9
    });

    marker.bindPopup(`
      <b>${r.name}</b><br>
      ${r.address || ""}<br>
      ${r.postcode || ""}
    `);

    if (type === "uni")       uniCluster.addLayer(marker);
    if (type === "workplace") workplaceCluster.addLayer(marker);
    if (type === "club")      clubCluster.addLayer(marker);
    if (type === "cop")       copCluster.addLayer(marker);
    if (type === "hub")       hubCluster.addLayer(marker);

    initiativeMarkers.push(marker);
  });

  
  lgaMasterData.forEach(row => {
    const code = (row.lga_code || "").trim();
    const count = Number(row.crisp_settled || 0);
  
    if (!code || !count) return;
  
    const centre = lgaCentres[code];
  
    if (!centre) {
      console.warn("CRISP LGA not found in GeoJSON:", row.lga_name);
      return;
    }
  
    const displayCount = publicCountText(count);
    const displayName = publicLGAName(centre.displayName);
  
    const circle = L.circleMarker([centre.lat, centre.lon], {
      radius: crispRadius(count),
      color: "#d98ca3",
      fillColor: "#d98ca3",
      fillOpacity: 0.55,
      weight: 2
    });
  
    circle.bindTooltip(`${displayName}: ${displayCount} people settled`, {
      direction: "top",
      opacity: 0.9
    });
  
    circle.bindPopup(`
      <b>${displayName}</b><br>
      ${displayCount} people settled through CRISP
    `);
  
    crispLayer.addLayer(circle);
  });

  uniCluster.addTo(map);
  workplaceCluster.addTo(map);
  clubCluster.addTo(map);
  copCluster.addTo(map);
  hubCluster.addTo(map);
  crispLayer.addTo(map);

  function applyJitterToMarkers(clusterGroup) {
    clusterGroup.eachLayer(marker => {
      if (!marker.originalLatLng) {
        marker.originalLatLng = marker.getLatLng();
      }

      if (map.getZoom() >= clusterGroup.options.disableClusteringAtZoom) {
        const jitterLat = (Math.random() - 0.5) * 0.0010;
        const jitterLon = (Math.random() - 0.5) * 0.0010;

        marker.setLatLng([
          marker.originalLatLng.lat + jitterLat,
          marker.originalLatLng.lng + jitterLon
        ]);
      } else {
        marker.setLatLng(marker.originalLatLng);
      }
    });
  }

  map.on("zoomend", () => {
    applyJitterToMarkers(uniCluster);
    applyJitterToMarkers(workplaceCluster);
    applyJitterToMarkers(clubCluster);
    applyJitterToMarkers(copCluster);
    applyJitterToMarkers(hubCluster);
  });

  const orgInput = document.getElementById("orgSearch");
  const allMarkers = [];

  function collectMarkers(clusterGroup) {
    clusterGroup.eachLayer(marker => allMarkers.push(marker));
  }

  collectMarkers(uniCluster);
  collectMarkers(workplaceCluster);
  collectMarkers(clubCluster);
  collectMarkers(copCluster);
  collectMarkers(hubCluster);

  const orgDropdown = document.createElement("div");
  orgDropdown.className = "searchDropdown";
  orgDropdown.style.zIndex = "20000";
  orgInput.parentNode.appendChild(orgDropdown);

  orgInput.addEventListener("input", () => {
    const q = orgInput.value.toLowerCase().trim();
    orgDropdown.innerHTML = "";

    if (q.length < 2) {
      orgDropdown.style.display = "none";
      return;
    }

    const matches = allMarkers.filter(marker => {
      const name = marker.options.title?.toLowerCase() || "";
      const pc = marker.options.postcode?.toString() || "";
      const markerState = marker.options.state;
    
      const matchesSearch = name.includes(q) || pc.includes(q);
      const matchesState = currentStateFilter === "ALL" || markerState === currentStateFilter;
    
      return matchesSearch && matchesState;
    });

    matches.forEach(marker => {
      const item = document.createElement("div");
      item.innerText = `${marker.options.title} (${marker.options.postcode || ""})`;

      item.onclick = () => {
        orgInput.value = marker.options.title;
        orgDropdown.style.display = "none";
        map.setView(marker.getLatLng(), 12);
        marker.openPopup();
      };

      orgDropdown.appendChild(item);
    });

    orgDropdown.style.display = matches.length ? "block" : "none";
  });

  if (window.innerWidth <= 600) {
    L.control.layers(
      null,
      {
        "Welcoming Universities": uniCluster,
        "Welcoming Workplaces": workplaceCluster,
        "Welcoming Clubs": clubCluster,
        "Community Organisations": copCluster,
        "Community Hubs": hubCluster,
        "CRISP Settlements": crispLayer
      },
      { collapsed: false }
    ).addTo(map);
  }

  const legend = L.control({ position: "bottomright" });

  legend.onAdd = function () {
    const div = L.DomUtil.create("div", "legend");
    div.innerHTML = `
      <i style="background:#CCA234; width:14px; height:14px; display:inline-block; border:1px solid #CCA234; margin-right:6px;"></i>
        Welcoming Cities<br>
      <i style="border:2px dashed #e67373; width:14px; height:14px; display:inline-block; margin-right:6px;"></i>
        PALM Mayoral Alliance<br>
      <span style="display:inline-block; width:14px; height:14px; border-radius:50%; background:#00AFC7; opacity:0.75; margin-right:6px;"></span>
  Welcoming Universities<br>
      <span style="display:inline-block; width:14px; height:14px; border-radius:50%; background:#FD4731; opacity:0.75; margin-right:6px;"></span>
  Welcoming Workplaces<br>
      <span style="display:inline-block; width:14px; height:14px; border-radius:50%; background:#228B22; opacity:0.75; margin-right:6px;"></span>
  Welcoming Clubs<br>
      <span style="display:inline-block; width:14px; height:14px; border-radius:50%; background:#ff8800; opacity:0.75; margin-right:6px;"></span>
  Community Organisations<br>
      <span style="display:inline-block; width:14px; height:14px; border-radius:50%; background:#02006C; opacity:0.75; margin-right:6px;"></span>
  Community Hubs<br>
      <span style="display:inline-block; width:14px; height:14px; border-radius:50%; background:#d98ca3; opacity:0.75; margin-right:6px;"></span>
        CRISP Settlements<br>
    `;
    return div;
  };

  if (window.innerWidth <= 600) {
    legend.addTo(map);
  }

  const mobileMenuButton = document.getElementById("mobileMenuButton");
  const mobileMenuPanel = document.getElementById("mobileMenuPanel");
  const mobileMenuClose = document.getElementById("mobileMenuClose");
  
  mobileMenuButton.addEventListener("click", () => {
    mobileMenuPanel.classList.add("open");
  });
  
  mobileMenuClose.addEventListener("click", () => {
    mobileMenuPanel.classList.remove("open");
  });

  const mobileLayerMap = {
    uni: uniCluster,
    workplace: workplaceCluster,
    club: clubCluster,
    cop: copCluster,
    hub: hubCluster,
    crisp: crispLayer
  };

  document.querySelectorAll(".desktopLayerToggle").forEach(toggle => {
    toggle.addEventListener("change", () => {
      const layer = mobileLayerMap[toggle.dataset.layer];
  
      if (!layer) return;
  
      if (toggle.checked) {
        map.addLayer(layer);
      } else {
        map.removeLayer(layer);
      }
    });
  });
  
  document.querySelectorAll(".mobileLayerToggle").forEach(toggle => {
    toggle.addEventListener("change", () => {
      const layer = mobileLayerMap[toggle.dataset.layer];
  
      if (!layer) return;
  
      if (toggle.checked) {
        map.addLayer(layer);
      } else {
        map.removeLayer(layer);
      }
    });
  });

  function applyStateFilter(selectedState) {
    currentStateFilter = selectedState;
    
    const groups = {
      uni: uniCluster,
      workplace: workplaceCluster,
      club: clubCluster,
      cop: copCluster,
      hub: hubCluster
    };
  
    Object.values(groups).forEach(group => {
      group.clearLayers();
    });
  
    initiativeMarkers.forEach(marker => {
      const markerState = marker.options.state;
      if (selectedState !== "ALL" && markerState !== selectedState) return;
      const markerType = marker.options.type;
      const group = groups[markerType];
  
      if (!group) return;
  
      if (selectedState === "ALL" || markerState === selectedState) {
        group.addLayer(marker);
      }
    });
  
    if (selectedState === "ALL") {
      if (selectedLGALayer) {
          selectedLGALayer.closePopup();
          selectedLGALayer.setStyle(lgaStyle(selectedLGALayer.feature));
          selectedLGALayer = null;
      }
      map.setView([-25.0, 134.0], window.innerWidth <= 600 ? 3 : 5);
    } else if (stateBounds[selectedState]) {
      map.fitBounds(stateBounds[selectedState], {
        padding: [20, 20],
        maxZoom: 7
      });
    }
    updateExplorerState();
  }

function updateExplorerState() {
  const selectedState = currentStateFilter;

  explorerState = {
    selection: {
      state: selectedState,
      lga: null,
      organisation: null
    },
    welcomingCities: {
      members: 0,
      accredited: 0
    },
    palmAlliance: {
      members: 0
    },
    initiatives: {
      universities: 0,
      workplaces: 0,
      clubs: 0,
      communityOrganisations: 0,
      communityHubs: 0,
      total: 0
    },
    accreditation: {
      established: 0,
      advanced: 0,
      excelling: 0,
      total: 0
    },
    crisp: {
      lgas: 0,
      peopleSettled: 0
    },
    organisations: []
  };

  Object.values(lgaMasterLookup).forEach(profile => {
    const profileState = (profile.state || "").trim().toUpperCase();

    if (selectedState !== "ALL" && profileState !== selectedState) return;

    if (profile.welcoming_city_member?.trim().toUpperCase() === "Y") {
      explorerState.welcomingCities.members++;
    }

    if (profile.welcoming_city_accreditation?.trim()) {
      explorerState.welcomingCities.accredited++;
    }

    if (profile.palm_alliance?.trim().toUpperCase() === "Y") {
      explorerState.palmAlliance.members++;
    }

    const crispSettled = Number(profile.crisp_settled || 0);

    if (crispSettled > 0) {
      explorerState.crisp.lgas++;
      explorerState.crisp.peopleSettled += crispSettled;
    }
  });

  const initiativeIds = {
    uni: new Set(),
    workplace: new Set(),
    club: new Set(),
    cop: new Set(),
    hub: new Set()
  };

  initiativeMarkers.forEach(marker => {
    const markerState = marker.options.state;
  
    if (selectedState !== "ALL" && markerState !== selectedState) return;
  
    const type = marker.options.type;
    const id = marker.options.institutionId || marker.options.title;
  
    if (initiativeIds[type]) {
      initiativeIds[type].add(id);
    }
  
    explorerState.organisations.push({
      name: marker.options.title,
      type: marker.options.type,
      state: marker.options.state,
      accreditation: marker.options.accreditation || ""
    });
  });
  explorerState.initiatives.universities = initiativeIds.uni.size;
  explorerState.initiatives.workplaces = initiativeIds.workplace.size;
  explorerState.initiatives.clubs = initiativeIds.club.size;
  explorerState.initiatives.communityOrganisations = initiativeIds.cop.size;
  explorerState.initiatives.communityHubs = initiativeIds.hub.size;
  
  explorerState.initiatives.total =
  explorerState.welcomingCities.members +
  explorerState.initiatives.universities +
  explorerState.initiatives.workplaces +
  explorerState.initiatives.clubs +
  explorerState.initiatives.communityOrganisations +
  explorerState.initiatives.communityHubs;
  
  console.log("Explorer state:", explorerState);
  renderExplorerSummary();
}

  function renderExplorerSummary() {
    const summary = document.getElementById("desktopSummaryContent");
    if (!summary) return;
  
    const regionName = explorerState.selection.state === "ALL"
      ? "Australia"
      : explorerState.selection.state;
  
    summary.innerHTML = `
      <div class="overviewCard">
        <h4>${regionName}</h4>
  
        <div class="summaryRow totalRow">
          <span>Total initiatives</span>
          <strong>${explorerState.initiatives.total}</strong>
        </div>
  
        <div class="summaryRow subRow">
          <span>Welcoming Cities</span>
          <strong>${explorerState.welcomingCities.members}</strong>
        </div>
  
        <div class="summaryRow subSubRow">
          <span>Accredited Cities</span>
          <strong>${explorerState.welcomingCities.accredited}</strong>
        </div>
  
        <div class="summaryRow subRow">
          <span>Universities</span>
          <strong>${explorerState.initiatives.universities}</strong>
        </div>
  
        <div class="summaryRow subRow">
          <span>Workplaces</span>
          <strong>${explorerState.initiatives.workplaces}</strong>
        </div>
  
        <div class="summaryRow subRow">
          <span>Clubs</span>
          <strong>${explorerState.initiatives.clubs}</strong>
        </div>
  
        <div class="summaryRow subRow">
          <span>Community Organisations</span>
          <strong>${explorerState.initiatives.communityOrganisations}</strong>
        </div>
  
        <div class="summaryRow subRow">
          <span>Community Hubs</span>
          <strong>${explorerState.initiatives.communityHubs}</strong>
        </div>
  
        <div class="summaryRow">
          <span>PALM Alliance LGAs</span>
          <strong>${explorerState.palmAlliance.members}</strong>
        </div>
  
        <div class="summaryRow">
          <span>CRISP settled</span>
          <strong>${explorerState.crisp.peopleSettled}</strong>
        </div>
      </div>
    `;
  }
  updateExplorerState();


  const stateFilter = document.getElementById("stateFilter");
  const mobileStateFilter = document.getElementById("mobileStateFilter");
  
  stateFilter.addEventListener("change", () => {
    const selectedState = stateFilter.value;
    mobileStateFilter.value = selectedState;
    applyStateFilter(selectedState);
  });
  
  mobileStateFilter.addEventListener("change", () => {
    const selectedState = mobileStateFilter.value;
    stateFilter.value = selectedState;
    mobileMenuPanel.classList.remove("open");
    applyStateFilter(selectedState);
  });

  const input = document.getElementById("lgaSearch");

  const dropdown = document.createElement("div");
  dropdown.className = "searchDropdown";
  dropdown.style.zIndex = "50000";
  input.parentNode.appendChild(dropdown);

  input.addEventListener("input", () => {
    const q = input.value.toLowerCase().trim();
    dropdown.innerHTML = "";

    if (q.length < 2) {
      dropdown.style.display = "none";
      return;
    }

    const matches = Object.keys(lgaLayers).filter(name => {
      const info = lgaLayers[name];
      const matchesSearch = name.includes(q);
      const matchesState = currentStateFilter === "ALL" || info.state === currentStateFilter;
    
      return matchesSearch && matchesState;
    });

    matches.forEach(nameKey => {
      const info = lgaLayers[nameKey];
      const item = document.createElement("div");
      item.innerText = info.displayName;

      item.onclick = () => {
        input.value = info.displayName;
        dropdown.style.display = "none";
        map.fitBounds(info.layer.getBounds(), {
          maxZoom: 11,
          paddingTopLeft: [20, 150],
          paddingBottomRight: [20, 80]
        });
        flashLGA(info.layer);
        showLGAPopup(info.displayName, info.layer);
      };

      dropdown.appendChild(item);
    });

    dropdown.style.display = matches.length ? "block" : "none";
  });

  const mobileLgaInput = document.getElementById("mobileLgaSearch");
const mobileLgaDropdown = document.getElementById("mobileLgaDropdown");

mobileLgaInput.addEventListener("input", () => {
  const q = mobileLgaInput.value.toLowerCase().trim();
  mobileLgaDropdown.innerHTML = "";

  if (q.length < 2) {
    mobileLgaDropdown.style.display = "none";
    return;
  }

  const matches = Object.keys(lgaLayers).filter(name => {
    const info = lgaLayers[name];
    const matchesSearch = name.includes(q);
    const matchesState = currentStateFilter === "ALL" || info.state === currentStateFilter;
  
    return matchesSearch && matchesState;
  });

  matches.forEach(nameKey => {
    const info = lgaLayers[nameKey];
    const item = document.createElement("div");
    item.innerText = info.displayName;

    item.onclick = () => {
      mobileLgaInput.value = info.displayName;
      mobileLgaDropdown.style.display = "none";
      mobileMenuPanel.classList.remove("open");

      const centre = info.layer.getBounds().getCenter();
      map.setView(centre, 10);

      flashLGA(info.layer);
      showLGAPopup(info.displayName, info.layer);
    };

    mobileLgaDropdown.appendChild(item);
  });

  mobileLgaDropdown.style.display = matches.length ? "block" : "none";
});


const mobileOrgInput = document.getElementById("mobileOrgSearch");
const mobileOrgDropdown = document.getElementById("mobileOrgDropdown");

mobileOrgInput.addEventListener("input", () => {
  const q = mobileOrgInput.value.toLowerCase().trim();
  mobileOrgDropdown.innerHTML = "";

  if (q.length < 2) {
    mobileOrgDropdown.style.display = "none";
    return;
  }

  const matches = allMarkers.filter(marker => {
    const name = marker.options.title?.toLowerCase() || "";
    const pc = marker.options.postcode?.toString() || "";
    const markerState = marker.options.state;
  
    const matchesSearch = name.includes(q) || pc.includes(q);
    const matchesState = currentStateFilter === "ALL" || markerState === currentStateFilter;
  
    return matchesSearch && matchesState;
  });

  matches.forEach(marker => {
    const item = document.createElement("div");
    item.innerText = `${marker.options.title} (${marker.options.postcode || ""})`;

    item.onclick = () => {
      mobileOrgInput.value = marker.options.title;
      mobileOrgDropdown.style.display = "none";
      mobileMenuPanel.classList.remove("open");

      map.setView(marker.getLatLng(), 12);
      marker.openPopup();
    };

    mobileOrgDropdown.appendChild(item);
  });

  mobileOrgDropdown.style.display = matches.length ? "block" : "none";
});

  
})
.then(() => {

  document.querySelectorAll(".clearSearch").forEach(btn => {

    const input = document.getElementById(btn.dataset.target);

    input.addEventListener("input", () => {
      btn.style.display = input.value ? "block" : "none";
    });

    btn.addEventListener("click", () => {

      input.value = "";
      btn.style.display = "none";

      if (input.id === "lgaSearch") {
        dropdown.style.display = "none";
      }

      if (input.id === "orgSearch") {
        orgDropdown.style.display = "none";
      }

      map.setView([-25, 134], window.innerWidth <= 600 ? 3 : 5);

      if (stateFilter.value !== "ALL") {
        stateFilter.value = "ALL";
        mobileStateFilter.value = "ALL";
        applyStateFilter("ALL");
      }

    });

  });

})

.catch(error => {
    console.error("Map data failed to load:", error);
});
</script>
