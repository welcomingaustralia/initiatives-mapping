<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Welcoming Map – Working Copy</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    #map {
      height: 100%;
      width: 100%;
    }

    .searchBox {
      position: absolute;
      left: 10px;
      z-index: 9999;
      background: white;
      border-radius: 4px;
      border: 1px solid #ccc;
      padding: 6px 8px;
      font-size: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    .searchBox input {
      border: none;
      outline: none;
      width: 220px;
      font-size: 14px;
    }

    #lgaSearchBox {
      top: 10px;
    }

    #orgSearchBox {
      top: 60px;
    }

    .legend {
      background-color: white;
      padding: 15px;
      border: 2px solid #bbb;
      border-radius: 8px;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
      font-size: 14px;
      line-height: 1.4;
    }

    .legend i {
      min-width: 18px;
      text-align: center;
    }

    .leaflet-control-layers {
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      background: white;
    }
  </style>
</head>

<body>

<div id="lgaSearchBox" class="searchBox">
  <input id="lgaSearch" type="text" placeholder="Search LGA (min 3 letters)…">
</div>

<div id="orgSearchBox" class="searchBox">
  <input id="orgSearch" type="text" placeholder="Search organisation or postcode…">
</div>

<div id="map"></div>

<script>
// -----------------------------------
// 1. DATA SOURCES
// -----------------------------------
const GEOJSON_URL =
  "https://raw.githubusercontent.com/welcomingaustralia/initiatives-mapping/main/LGA_2025_AUST_GDA2020.min.json";

const POINTS_URL =
  "https://raw.githubusercontent.com/welcomingaustralia/initiatives-mapping/main/welcoming_points_centroids.csv";

const WELC_LGAS_URL =
  "https://raw.githubusercontent.com/welcomingaustralia/initiatives-mapping/main/welcoming_lgas.csv";

const CRISP_LGA_URL =
  "https://raw.githubusercontent.com/welcomingaustralia/initiatives-mapping/main/crisp_lgas.csv";


// -----------------------------------
// 2. MAP SETUP
// -----------------------------------
const map = L.map("map").setView([-25.0, 134.0], 5);

map.zoomControl.setPosition("bottomleft");

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18
}).addTo(map);


// -----------------------------------
// 3. CLUSTERS AND LAYERS
// -----------------------------------
const clusterOptions = {
  spiderfyOnMaxZoom: true,
  zoomToBoundsOnClick: true,
  maxClusterRadius: 50,
  disableClusteringAtZoom: 11
};

const uniCluster       = L.markerClusterGroup(clusterOptions);
const workplaceCluster = L.markerClusterGroup(clusterOptions);
const clubCluster      = L.markerClusterGroup(clusterOptions);
const copCluster       = L.markerClusterGroup(clusterOptions);
const hubCluster       = L.markerClusterGroup(clusterOptions);

const crispLayer = L.layerGroup();

document.head.insertAdjacentHTML("beforeend", `
<style>
.marker-cluster-small,
.marker-cluster-medium,
.marker-cluster-large {
  background: #b0b0b0;
  color: #000000;
}
.marker-cluster-small div,
.marker-cluster-medium div,
.marker-cluster-large div {
  background: rgba(255,255,255,0.6);
}
</style>`);


// -----------------------------------
// 4. HELPERS
// -----------------------------------
function loadCSV(url) {
  return fetch(url)
    .then(r => r.text())
    .then(t => Papa.parse(t, { header: true, skipEmptyLines: true }).data);
}

function toTitleCase(str) {
  return str
    .toLowerCase()
    .split(" ")
    .map(word => word ? word[0].toUpperCase() + word.slice(1) : "")
    .join(" ");
}

function normaliseName(str) {
  return (str || "").trim().toLowerCase();
}

function publicLGAName(name) {
  if (name === "Unincorporated ACT") return "ACT";
  if (name === "Unincorporated NT") return "NT";
  return name;
}

function publicCountText(count) {
  return count < 5 ? "Less than 5" : count;
}

function crispRadius(count) {
  // Privacy: all counts under 5 use the same circle size.
  if (count < 5) return 8;

  // Square-root scaling keeps large values readable.
  return Math.max(10, Math.sqrt(count) * 5);
}

const lgaLayers = {};
const lgaCentres = {};


// -----------------------------------
// 5. LOAD DATA
// -----------------------------------
Promise.all([
  loadCSV(WELC_LGAS_URL),
  fetch(GEOJSON_URL).then(r => r.json()),
  loadCSV(POINTS_URL),
  loadCSV(CRISP_LGA_URL)
])
.then(([welcList, geojson, points, crispData]) => {

  // -----------------------------------
  // Welcoming LGAs
  // -----------------------------------
  const welcomingLGAs = new Set(
    welcList.map(r => r.lga_name?.trim()).filter(Boolean)
  );

  // PALM Mayoral Alliance LGAs
  const palmAllianceLGAs = new Set([
    "Leeton",
    "Wagga Wagga",
    "Mount Isa",
    "Mareeba Shire",
    "Southern Downs",
    "Hinchinbrook",
    "Rockhampton",
    "Lockyer Valley",
    "Western Downs",
    "Banana",
    "South Burnett",
    "Cassowary Coast",
    "Greater Hume",
    "Griffith",
    "Berrigan",
    "Sunshine Coast",
    "Central Coast (Tas.)"
  ]);


  // -----------------------------------
  // 6. LGA POLYGONS
  // -----------------------------------
  function lgaStyle(feature) {
    const name = feature.properties.LGA_NAME25;

    const isWelcoming = welcomingLGAs.has(name);
    const isPalm = palmAllianceLGAs.has(name);

    let style = isWelcoming
      ? { fillColor: "#ffe680", color: "#cc9900", weight: 1, fillOpacity: 0.40 }
      : { fillColor: "#f2f2f2", color: "#999", weight: 0.3, fillOpacity: 0.1 };

    if (isPalm) {
      style.color = "#e67373";
      style.weight = 3;
      style.dashArray = "4 4";
    }

    return style;
  }

  L.geoJSON(geojson, {
    style: lgaStyle,
    onEachFeature: (feature, layer) => {
      const rawName = feature.properties.LGA_NAME25 || "";
      const key = normaliseName(rawName);
      const displayName = toTitleCase(rawName);
      const publicName = publicLGAName(rawName);

      lgaLayers[key] = { layer, displayName: publicName };

      const centre = layer.getBounds().getCenter();
      lgaCentres[key] = {
        lat: centre.lat,
        lon: centre.lng,
        displayName: publicName
      };

      layer.bindTooltip(publicName);
    }
  }).addTo(map);


  // -----------------------------------
  // 7. STANDARD POINT MARKERS
  // -----------------------------------
  const iconMap = {
    uni:       { icon: "fa-university", color: "#C44444" },
    workplace: { icon: "fa-building",   color: "#2E8B57" },
    club:      { icon: "fa-flag",       color: "#800080" },
    cop:       { icon: "fa-users",      color: "#ff8800" },
    hub:       { icon: "fa-home",       color: "#0077cc" }
  };

  points.forEach(r => {
    if (!r.lat || !r.lon) return;

    const type = r.type?.trim().toLowerCase();

    // CRISP is handled separately through crisp_lga_counts.csv.
    if (type === "crisp") return;

    const cfg = iconMap[type] || { icon: "fa-map-marker", color: "#444" };

    const jitterLat = (Math.random() - 0.5) * 0.0015;
    const jitterLon = (Math.random() - 0.5) * 0.0015;

    const lat = +r.lat + jitterLat;
    const lon = +r.lon + jitterLon;

    const marker = L.marker([lat, lon], {
      icon: L.divIcon({
        className: "fa-icon",
        html: `<i class="fa ${cfg.icon}" style="color:${cfg.color}; font-size:20px;"></i>`,
        iconSize: [20, 20]
      }),
      title: r.name,
      postcode: r.postcode
    });

    marker.bindTooltip(r.name, {
      direction: "top",
      offset: [0, -10],
      opacity: 0.9
    });

    marker.bindPopup(`
      <b>${r.name}</b><br>
      ${r.address || ""}<br>
      ${r.postcode || ""}
    `);

    if (type === "uni")       uniCluster.addLayer(marker);
    if (type === "workplace") workplaceCluster.addLayer(marker);
    if (type === "club")      clubCluster.addLayer(marker);
    if (type === "cop")       copCluster.addLayer(marker);
    if (type === "hub")       hubCluster.addLayer(marker);
  });


  // -----------------------------------
  // 8. CRISP SETTLEMENTS — ONE CIRCLE PER LGA
  // -----------------------------------
  crispData.forEach(row => {
    const rawLGAName = row.lga_name?.trim();
    const count = Number(row.count);

    if (!rawLGAName || !count) return;

    const key = normaliseName(rawLGAName);
    const centre = lgaCentres[key];

    if (!centre) {
      console.warn("CRISP LGA not found in GeoJSON:", rawLGAName);
      return;
    }

    const displayCount = publicCountText(count);
    const displayName = publicLGAName(centre.displayName);

    const circle = L.circleMarker([centre.lat, centre.lon], {
      radius: crispRadius(count),
      color: "#d81b60",
      fillColor: "#d81b60",
      fillOpacity: 0.55,
      weight: 2
    });

    circle.bindTooltip(`${displayName}: ${displayCount} people settled`, {
      direction: "top",
      opacity: 0.9
    });

    circle.bindPopup(`
      <b>${displayName}</b><br>
      ${displayCount} people settled through CRISP
    `);

    crispLayer.addLayer(circle);
  });


  // -----------------------------------
  // 9. ADD LAYERS TO MAP
  // -----------------------------------
  uniCluster.addTo(map);
  workplaceCluster.addTo(map);
  clubCluster.addTo(map);
  copCluster.addTo(map);
  hubCluster.addTo(map);
  crispLayer.addTo(map);


  // -----------------------------------
  // 10. JITTER ON ZOOM FOR STANDARD MARKERS ONLY
  // -----------------------------------
  function applyJitterToMarkers(clusterGroup) {
    clusterGroup.eachLayer(marker => {
      if (!marker.originalLatLng) {
        marker.originalLatLng = marker.getLatLng();
      }

      if (map.getZoom() >= clusterGroup.options.disableClusteringAtZoom) {
        const jitterLat = (Math.random() - 0.5) * 0.0010;
        const jitterLon = (Math.random() - 0.5) * 0.0010;

        marker.setLatLng([
          marker.originalLatLng.lat + jitterLat,
          marker.originalLatLng.lng + jitterLon
        ]);
      } else {
        marker.setLatLng(marker.originalLatLng);
      }
    });
  }

  map.on("zoomend", () => {
    applyJitterToMarkers(uniCluster);
    applyJitterToMarkers(workplaceCluster);
    applyJitterToMarkers(clubCluster);
    applyJitterToMarkers(copCluster);
    applyJitterToMarkers(hubCluster);
  });


  // -----------------------------------
  // 11. ORGANISATION SEARCH
  // -----------------------------------
  const orgInput = document.getElementById("orgSearch");
  const allMarkers = [];

  function collectMarkers(clusterGroup) {
    clusterGroup.eachLayer(marker => allMarkers.push(marker));
  }

  collectMarkers(uniCluster);
  collectMarkers(workplaceCluster);
  collectMarkers(clubCluster);
  collectMarkers(copCluster);
  collectMarkers(hubCluster);

  const orgDropdown = document.createElement("div");
  orgDropdown.style.position = "absolute";
  orgDropdown.style.background = "white";
  orgDropdown.style.border = "1px solid #ccc";
  orgDropdown.style.width = "220px";
  orgDropdown.style.maxHeight = "200px";
  orgDropdown.style.overflowY = "auto";
  orgDropdown.style.display = "none";
  orgDropdown.style.zIndex = 99999;
  orgInput.parentNode.appendChild(orgDropdown);

  orgInput.addEventListener("input", () => {
    const q = orgInput.value.toLowerCase().trim();
    orgDropdown.innerHTML = "";

    if (q.length < 2) {
      orgDropdown.style.display = "none";
      return;
    }

    const matches = allMarkers.filter(marker => {
      const name = marker.options.title?.toLowerCase() || "";
      const pc = marker.options.postcode?.toString() || "";
      return name.includes(q) || pc.includes(q);
    });

    matches.forEach(marker => {
      const item = document.createElement("div");
      item.style.padding = "5px";
      item.style.cursor = "pointer";
      item.innerText = `${marker.options.title} (${marker.options.postcode || ""})`;

      item.onclick = () => {
        orgInput.value = marker.options.title;
        orgDropdown.style.display = "none";
        map.setView(marker.getLatLng(), 12);
        marker.openPopup();
      };

      orgDropdown.appendChild(item);
    });

    orgDropdown.style.display = matches.length ? "block" : "none";
  });


  // -----------------------------------
  // 12. LAYER CONTROL
  // -----------------------------------
  L.control.layers(
    null,
    {
      "Welcoming Universities": uniCluster,
      "Welcoming Workplaces": workplaceCluster,
      "Welcoming Clubs": clubCluster,
      "Community Organisations": copCluster,
      "Community Hubs": hubCluster,
      "CRISP settlements": crispLayer
    },
    { collapsed: false }
  ).addTo(map);


  // -----------------------------------
  // 13. LEGEND
  // -----------------------------------
  const legend = L.control({ position: "bottomright" });

  legend.onAdd = function () {
    const div = L.DomUtil.create("div", "legend");
    div.innerHTML = `
      <i style="background:#ffe680; width:14px; height:14px; display:inline-block; border:1px solid #cc9900; margin-right:6px;"></i>
        Welcoming Cities<br>
      <i style="border:2px dashed #e67373; width:14px; height:14px; display:inline-block; margin-right:6px;"></i>
        PALM Mayoral Alliance<br>
      <i class="fa fa-university" style="color:#C44444; margin-right:6px;"></i>
        Welcoming Universities<br>
      <i class="fa fa-building" style="color:#2E8B57; margin-right:6px;"></i>
        Welcoming Workplaces<br>
      <i class="fa fa-flag" style="color:#800080; margin-right:6px;"></i>
        Welcoming Clubs<br>
      <i class="fa fa-users" style="color:#ff8800; margin-right:6px;"></i>
        Community Organisations<br>
      <i class="fa fa-home" style="color:#0077cc; margin-right:6px;"></i>
        Community Hubs<br>
      <span style="display:inline-block; width:14px; height:14px; border-radius:50%; background:#d81b60; opacity:0.65; margin-right:6px;"></span>
        CRISP settlements<br>
    `;
    return div;
  };

  legend.addTo(map);


  // -----------------------------------
  // 14. LGA SEARCH
  // -----------------------------------
  const input = document.getElementById("lgaSearch");

  const dropdown = document.createElement("div");
  dropdown.style.position = "absolute";
  dropdown.style.background = "white";
  dropdown.style.border = "1px solid #ccc";
  dropdown.style.width = "220px";
  dropdown.style.maxHeight = "200px";
  dropdown.style.overflowY = "auto";
  dropdown.style.display = "none";
  dropdown.style.zIndex = 99999;
  input.parentNode.appendChild(dropdown);

  input.addEventListener("input", () => {
    const q = input.value.toLowerCase().trim();
    dropdown.innerHTML = "";

    if (q.length < 2) {
      dropdown.style.display = "none";
      return;
    }

    const matches = Object.keys(lgaLayers).filter(name => name.includes(q));

    matches.forEach(nameKey => {
      const info = lgaLayers[nameKey];
      const item = document.createElement("div");
      item.style.padding = "5px";
      item.style.cursor = "pointer";
      item.innerText = info.displayName;

      item.onclick = () => {
        input.value = info.displayName;
        dropdown.style.display = "none";
        map.fitBounds(info.layer.getBounds(), { maxZoom: 10 });
      };

      dropdown.appendChild(item);
    });

    dropdown.style.display = matches.length ? "block" : "none";
  });

})
.catch(error => {
  console.error("Map data failed to load:", error);
});
</script>

</body>
</html>
